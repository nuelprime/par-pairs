     UX paradigm: search-first left rail (facet nav) + dense market table. Unit of a row = a MARKET (token x pair). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* lifted from par.family's computed styles */
  --deep:#171819; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.06);
  --text:#e9ebe9; --dim:#999f9a; --dimmer:#6f746f;
  --cream:#fbf3d5; --gold:#d6b567; --muted:#8c8f8a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --ui:'Geist',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden}
body{
  background:var(--deep);color:var(--text);font-family:var(--ui);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}

.shell{display:grid;grid-template-columns:246px minmax(0,1fr);height:100vh;overflow:hidden}

/* ---- masthead ---- */
.brand{
  display:flex;align-items:center;gap:.55rem;
  padding:1rem 1rem .9rem;border-bottom:1px solid var(--line);
}
.brand{align-items:center}
.brand #mark{width:24px;height:24px;border-radius:7px;object-fit:cover}
.brand h1{font-size:1.05rem;font-weight:600;letter-spacing:-.02em}

/* ---- pair rail ---- */
.rail{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
}
.railhead{padding:.85rem 1rem .55rem}
.search{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:.42rem .6rem;color:var(--text);font-family:var(--mono);font-size:.78rem;
}
.search::placeholder{color:var(--dimmer)}
.search:focus{outline:2px solid var(--cream);outline-offset:-1px}

.pairs{overflow-y:auto;flex:1;padding:.25rem .4rem 1rem;min-height:0;min-width:0}
.pair{
  display:grid;grid-template-columns:6px 1fr auto;gap:.55rem;align-items:center;
  width:100%;text-align:left;padding:.42rem .7rem;border-radius:999px;
}
.pair:hover{background:var(--panel2)}
.pair[aria-current="true"]{background:var(--cream);color:#171819}
.pair[aria-current="true"] .n{color:rgba(23,24,25,.55)}
.pair .dot{width:6px;height:6px;border-radius:50%}
.pair .sym{font-family:var(--mono);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair[aria-current="true"] .sym{color:#171819;font-weight:600}
.pair .n{font-family:var(--mono);font-size:.72rem;color:var(--dimmer)}
.pair.rollup .sym{color:var(--dim);font-style:italic}
.railnote{padding:.5rem 1rem;font-size:.7rem;color:var(--dimmer);border-top:1px solid var(--line)}
.live{display:inline-flex;align-items:center;margin-left:auto}
.live::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.live.on{color:var(--gold)}
.live.on::before{animation:pulse 2.4s ease-in-out infinite}
.live.off{color:var(--dimmer)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live.on::before{animation:none}}

/* ---- main ---- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  padding:.95rem 1.15rem;border-bottom:1px solid var(--line);
}
.ctx{display:flex;align-items:baseline;gap:.55rem;min-width:0}
.ctx b{font-size:1.15rem;font-weight:600;letter-spacing:-.015em}
.ctx .quote{font-family:var(--mono);color:var(--cream)}
.ctx small{font-family:var(--mono);font-size:.72rem;color:var(--dim)}
.risks{display:flex;gap:.3rem;margin-left:auto}
.sorts{display:none}
.only-s{display:none}
.ico{width:13px;height:13px;vertical-align:-2px}
td.stack b{display:block;font-weight:500;font-size:.82rem;line-height:1.3}
td.stack.val b{color:var(--gold)}
td.stack b small{color:var(--dimmer);font-size:.6rem;margin-left:.2rem;font-family:var(--ui)}
td.stack .q{display:block;color:var(--dim);font-size:.68rem;line-height:1.3}
.chip{
  font-family:var(--mono);font-size:.7rem;padding:.24rem .6rem;border-radius:999px;
  border:1px solid var(--line2);color:var(--dimmer);
}
.chip[aria-pressed="true"]{border-color:currentColor}
.chip.native[aria-pressed="true"]{color:var(--cream);border-color:var(--cream)}
.chip.verified[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.chip.wild[aria-pressed="true"]{color:var(--muted);border-color:var(--muted)}

.scroll{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:separate;border-spacing:0}
thead{background:#171819}
thead tr{background:#171819}
thead th{
  position:sticky;top:0;background:#171819;z-index:5;
  -webkit-backdrop-filter:none;
  font-size:.7rem;font-weight:500;color:var(--dimmer);text-align:right;
  padding:.5rem .7rem;white-space:nowrap;
  box-shadow:inset 0 -1px 0 var(--line);
}
thead th:first-child,thead th:nth-child(2){text-align:left}
tbody td.hide-s:first-child{width:2.4rem}
thead th button{font-size:inherit;color:inherit}
thead th button:hover{color:var(--text)}
thead th.on button{color:var(--cream)}
.nil{color:var(--dimmer)}
tbody td{
  padding:.6rem .8rem;border-bottom:1px solid var(--line2);
  text-align:right;font-family:var(--mono);font-size:.78rem;white-space:nowrap;
}
tbody td:first-child{text-align:left;color:var(--dimmer);font-size:.72rem;width:2.4rem}
tbody td.tok{text-align:left;font-family:var(--ui);white-space:normal}
tbody tr{cursor:pointer}
td.mcap{color:var(--gold);font-size:.86rem}
td.mcap small{color:var(--dimmer);font-size:.62rem;margin-left:.22rem;font-family:var(--ui)}
tbody tr:hover{background:var(--panel)}
.tokname .s a:hover{color:var(--cream)}
.tokname .s a:focus-visible{outline:2px solid var(--cream);outline-offset:2px;border-radius:2px}
.tokline{display:flex;align-items:center;gap:.55rem}
.logo{width:30px;height:30px;border-radius:8px;background:var(--panel2);flex:0 0 auto;object-fit:cover}
.tokname{min-width:0}
.tokname .s{font-weight:600;font-size:.85rem;display:block;line-height:1.2}
.tokname .n{font-size:.72rem;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14rem}
.mk{
  font-family:var(--mono);font-size:.62rem;color:var(--gold);
  background:var(--panel2);border-radius:999px;padding:.08rem .4rem;margin-left:.4rem;
  vertical-align:1px;
}
/* their explore cards badge every quote a token trades against; same treatment here */
.qpill{
  display:inline-flex;align-items:center;gap:.28rem;font-family:var(--mono);font-size:.66rem;
  background:var(--panel2);border-radius:999px;padding:.1rem .45rem;color:var(--text);
}
.qpill i{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.via{font-family:var(--mono);font-size:.7rem;color:var(--dim)}
.stale{color:var(--gold)}


.sk-b{
  display:inline-block;height:9px;border-radius:3px;
  background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.11) 37%,rgba(255,255,255,.05) 63%);
  background-size:280% 100%;animation:shimmer 1.5s linear infinite;
}
.sk-b.sm{height:7px;opacity:.72}
.sk-b.sq{height:30px;width:30px;border-radius:8px}
.slabs{display:flex;flex-direction:column;gap:.5rem;padding:.55rem .9rem 1.4rem}
.slab{background:var(--panel);border:1px solid var(--line2);border-radius:15px;padding:.7rem .8rem;cursor:pointer}
.slab:active{background:var(--panel2)}
.slab-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center}
.slab .logo{width:34px;height:34px;border-radius:9px}
.slab-id{min-width:0}
.slab-id .s{display:block;font-weight:600;font-size:.92rem;line-height:1.25}
.slab-id .qpill{margin-top:.22rem}
.slab-val{text-align:right;font-family:var(--mono);white-space:nowrap}
.slab-val b{display:block;font-weight:500;font-size:.9rem;color:var(--gold);line-height:1.25}
.slab-val b small{color:var(--dimmer);font-size:.6rem;margin-left:.2rem;font-family:var(--ui)}
.slab-val .q{display:block;color:var(--dim);font-size:.7rem;margin-top:.1rem}
.slab-foot{
  display:flex;gap:.85rem;margin-top:.65rem;padding-top:.55rem;
  border-top:1px solid var(--line2);font-family:var(--mono);font-size:.68rem;color:var(--dim);
}
.slab-foot span em{color:var(--dimmer);font-style:normal;margin-left:.2rem}
.slab-foot span.on{color:var(--cream)}
.slab.sk{cursor:default}
@keyframes shimmer{0%{background-position:110% 0}100%{background-position:-110% 0}}
@media (prefers-reduced-motion:reduce){.sk-b{animation:none}}
tr.sk td{vertical-align:middle}
tr.sk .tokname .sk-b{display:block}
tr.sk .tokname .sk-b + .sk-b{margin-top:5px}
td.stack .sk-b{display:block;margin-left:auto}
td.stack .sk-b + .sk-b{margin-top:5px}
.pair.sk{border:none;background:none;cursor:default}
.pair.sk .dot{background:rgba(255,255,255,.08)}
.state{padding:3rem 1.3rem;color:var(--dim);max-width:34rem}
.state b{display:block;color:var(--text);font-size:1rem}
.state code{font-family:var(--mono);font-size:.76rem;color:var(--gold)}

/* phone: the pair rail becomes a horizontal chip strip, so the table keeps the screen */
@media (max-width:820px){
  .shell{grid-template-columns:1fr;height:100vh}
  .rail{border-right:none;border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{padding:.7rem .9rem .6rem}
  .railhead{padding:.6rem .9rem .5rem}
  .pairs{
    display:flex;gap:.35rem;overflow-x:auto;overflow-y:hidden;
    padding:.1rem .9rem .7rem;scrollbar-width:none;
  }
  .pairs::-webkit-scrollbar{display:none}
  .pair{
    width:auto;grid-template-columns:6px auto auto;flex:0 0 auto;
    border:1px solid var(--line);padding:.3rem .55rem;gap:.4rem;
  }
  .pair .sym{max-width:7rem}
  .pair[aria-current="true"]{box-shadow:none;border-color:var(--cream)}
  .pair.rollup{display:none}
  .railnote{display:none}
  .bar{padding:.7rem .9rem;gap:.55rem}
  .risks{margin-left:0}
  .sorts{
    display:flex;gap:.3rem;order:3;width:100%;
    overflow-x:auto;scrollbar-width:none;padding-bottom:.1rem;
  }
  .sorts::-webkit-scrollbar{display:none}
  .sorts .chip{flex:0 0 auto}
  .sorts .chip[aria-pressed="true"]{color:var(--cream);border-color:var(--cream)}
  .tokname .n{max-width:8rem}
  .hide-s,.hide-m{display:none}
  .only-s{display:table-cell}
  tbody td,thead th{padding:.45rem .5rem}
  .ctx b{font-size:1rem}
}
</style>
</head>

  <main class="main">
    <div class="bar">
      <div class="ctx" id="ctx"><b>All pairs</b></div>
      <div class="sorts" id="sorts"></div>
      <div class="risks" id="risks">
        <button class="chip native"   data-risk="native"   aria-pressed="true">native</button>
        <button class="chip verified" data-risk="verified" aria-pressed="true">verified</button>
        <button class="chip wild"     data-risk="wild"     aria-pressed="true">wild</button>
      </div>
    </div>
    <div class="scroll" id="scroll"></div>
  </main>
</div>

<script>
const API = 'https://api.par.family';
const SUPPLY = 1e27;
const TOKEN_PAGE = t => `https://par.family/token/${t}`;

/* the indexer's logoUrl points at ipfs.io, which rate-limits (429) and leaves every
   logo blank. Try faster gateways first and walk the list on error. */
const GATEWAYS = [
  'https://ipfs.filebase.io/ipfs/',
  'https://gateway.pinata.cloud/ipfs/',
  'https://w3s.link/ipfs/',
  'https://ipfs.io/ipfs/'
];
function cidOf(row){
  const raw = row.logo || row.logoUrl || '';
  const m = String(raw).match(/(?:ipfs:\/\/|\/ipfs\/)([A-Za-z0-9./_-]+)/);
  return m ? m[1] : null;
}
window.nextGateway = function(img){
  const i = (+img.dataset.g || 0) + 1;
  if (i < GATEWAYS.length && img.dataset.cid){
    img.dataset.g = i;
    img.src = GATEWAYS[i] + img.dataset.cid;
  } else {
    img.replaceWith(Object.assign(document.createElement('span'), {className:'logo'}));
  }
};

const rawByToken = new Map();
let markets = [];
let facets  = [];
let live    = false;
let sel     = null;   // selected pairToken, null = all
let risks   = new Set(['native','verified','wild']);
let sort    = {key:'mcapEth', dir:-1};

/* ---------- fetch ---------- */
async function page(off){
  const r = await fetch(`${API}/launches?orderBy=createdAt&orderDirection=desc&limit=500&offset=${off}`);
  if (!r.ok) throw new Error(`${r.status} on /launches`);
  return r.json();
}

async function pullSome(tokens){
  const out = [];
  for (let i = 0; i < tokens.length; i += 40){
    const slice = tokens.slice(i, i + 40).join(',');
    const r = await fetch(`${API}/launches?token_in=${slice}&limit=500`);
    if (!r.ok) continue;
    out.push(...await r.json());
  }
  return out;
}

function store(rows){
  for (const r of rows) rawByToken.set(r.token.toLowerCase(), r);
}

function rebuild(){
  const rows = [...rawByToken.values()];
  markets = flatten(rows);
  facets  = buildFacets();
  draw();
}

const dirty = new Set();
let flushTimer = null;

function scheduleFlush(){
  if (flushTimer) return;
  flushTimer = setTimeout(async () => {
    flushTimer = null;
    const tokens = [...dirty];
    dirty.clear();
    if (!tokens.length) return;
    try {
      const rows = await pullSome(tokens);
      if (!rows.length) return;
      store(rows);
      const rate = deriveUsd([...rawByToken.values()]);
      if (rate) usdPerEth = rate;
      rebuild();
    } catch (e) {}
  }, 1800);
}

function connect(){
  const es = new EventSource(`${API}/events`);
  es.addEventListener('open', () => { live = true; drawStatus(); });
  es.addEventListener('error', () => { live = false; drawStatus(); });
  es.addEventListener('batch', ev => {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    for (const t of [...(d.launches || []), ...(d.trades || [])]) dirty.add(t.toLowerCase());
    if (dirty.size) scheduleFlush();
  });
}

function drawStatus(){
  const el = document.getElementById('railnote');
  if (el) el.textContent = `${facets.length} quotes, ${markets.length} markets`;
  const p = document.getElementById('pulse');
  if (p){
    p.className = `live ${live ? 'on' : 'off'}`;
    p.title = live ? 'streaming from the indexer' : 'reconnecting';
  }
}

/* ETH value of ONE BASE UNIT of the quote asset.
   lastPriceQuoteX18 is quote base units per whole token (fractional, despite the name,
   and NOT pre-divided by 1e18); lastPriceEth is the same price in ETH. Their ratio is the
   rate, so no decimals lookup is needed. It uses the last price across all history, so
   per-market volume is close, not exact: median 0.999 of the API's own token-wide
   totalVolumeEth over 555 launches, p10 0.79, p90 1.13. */
function ethPerBase(m){
  const pq = parseFloat(m.lastPriceQuoteX18);
  if (!pq || !m.lastPriceEth) return null;
  return m.lastPriceEth / pq;
}

/* the fanout: one launch -> one row per market */
function flatten(rows){
  const out = [];
  for (const r of rows){
    const list = r.markets && r.markets.length ? r.markets : [{
      index:0, pairToken:r.pairToken, poolId:r.poolId,
      quoteSymbol:r.quoteSymbol, quoteDecimals:r.quoteDecimals, quoteRisk:r.quoteRisk,
      totalVolumeQuote:r.totalVolumeQuote, tradeCount:r.tradeCount,
      lastPriceEth:r.lastPriceEth, lastPriceQuoteX18:r.lastPriceQuoteX18,
      lastPriceEthStale:false, tokensOnCurve:r.tokensOnCurve,
      quoteRaised:r.quoteRaised, lastTradeAt:r.lastTradeAt
    }];
    for (const m of list){
      const epb  = ethPerBase(m);
      const left = parseFloat(m.tokensOnCurve || '0');
      const circ = (parseFloat(r.supply || String(SUPPLY)) - parseFloat(r.burnedToken || '0')) / 1e18;
      out.push({
        token:r.token, symbol:r.symbol, name:r.name, cid:cidOf(r),
        marketCount:r.marketCount || 1, createdAt:r.createdAt,
        market:m.index ?? 0, pairToken:m.pairToken, poolId:m.poolId,
        quoteSymbol:m.quoteSymbol || '?', quoteRisk:m.quoteRisk || 'wild',
        quoteDecimals:m.quoteDecimals ?? 18,
        trades:m.tradeCount || 0,
        priceEth:m.lastPriceEth || 0, stale:!!m.lastPriceEthStale,
        mcapEth:(m.lastPriceEth || 0) * circ,
        lastTradeAt:m.lastTradeAt || 0,
        sold: left ? (SUPPLY/(r.marketCount||1) - left) / (SUPPLY/(r.marketCount||1)) : 0,
        volEth: epb ? parseFloat(m.totalVolumeQuote || '0') * epb : 0,
        volEthToken: r.totalVolumeEth || 0,
        tradesToken: r.tradeCount || 0
      });
    }
  }
  return out;
}

/* USDG is the chain's dollar stablecoin, so any USDG-quoted market implies an ETH/USD
   rate. Take the freshest few and use the median. Derived, not an oracle: it drifts a
   percent or two from the rate par.family's own pages show. */
let usdPerEth = 0;
function deriveUsd(rows){
  const USDG = '0x5fc5360d0400a0fd4f2af552add042d716f1d168';
  const hits = [];
  for (const r of rows) for (const m of (r.markets || [r])){
    if ((m.pairToken || '').toLowerCase() !== USDG) continue;
    const pq = parseFloat(m.lastPriceQuoteX18 || 0), pe = m.lastPriceEth || 0;
    if (!pq || !pe || m.lastPriceEthStale) continue;
    hits.push({at:m.lastTradeAt || 0, rate: 1 / ((pe / pq) * Math.pow(10, m.quoteDecimals ?? 6))});
  }
  if (!hits.length) return 0;
  const fresh = hits.sort((a,b) => b.at - a.at).slice(0,5).map(h => h.rate).sort((a,b) => a-b);
  return fresh[Math.floor(fresh.length/2)];
}

function buildFacets(){
  const by = new Map();
  for (const m of markets){
    let f = by.get(m.pairToken);
    if (!f) by.set(m.pairToken, f = {pairToken:m.pairToken, sym:m.quoteSymbol, risk:m.quoteRisk, n:0, volEth:0});
    f.n++; f.volEth += m.volEth;
  }
  return [...by.values()].sort((a,b) => b.n - a.n || b.volEth - a.volEth);
}

/* ---------- format ---------- */
const DASH = '<span class="nil">\u2013</span>';   // nothing traded yet reads better as a dash
const riskColor = r => r === 'native' ? 'var(--cream)' : r === 'verified' ? 'var(--gold)' : 'var(--muted)';
function usd(v){
  if (!v) return DASH;
  if (!usdPerEth) return eth(v) + 'Ξ';
  const d = v * usdPerEth;
  if (d >= 1e9) return '$' + (d/1e9).toFixed(2) + 'B';
  if (d >= 1e6) return '$' + (d/1e6).toFixed(2) + 'M';
  if (d >= 1e3) return '$' + (d/1e3).toFixed(1) + 'K';
  return '$' + d.toFixed(d < 1 ? 3 : 0);
}
const eth = v => !v ? DASH : v >= 100 ? Math.round(v).toLocaleString() : v >= 1 ? v.toFixed(1) : v >= .01 ? v.toFixed(3) : v.toExponential(1);
const px  = v => !v ? DASH : v.toExponential(2).replace('e-','e-');
function ago(t){
  if (!t) return DASH;
  const s = Date.now()/1000 - t;
  if (s < 90) return 'now';
  if (s < 5400) return Math.round(s/60) + 'm';
  if (s < 172800) return Math.round(s/3600) + 'h';
  return Math.round(s/86400) + 'd';
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- rail ---------- */
function drawRail(){
  const term = document.getElementById('q').value.trim().toUpperCase();
  const hit  = facets.filter(f => !term || f.sym.toUpperCase().includes(term));
  const main = term ? hit : hit.filter(f => f.n > 1);
  const ones = term ? [] : hit.filter(f => f.n === 1);

  let html = `<button class="pair" data-pt="" aria-current="${sel===null}">
      <span class="dot" style="background:var(--dimmer)"></span>
      <span class="sym">All pairs</span><span class="n">${markets.length}</span></button>`;

  html += main.map(f => `<button class="pair" data-pt="${f.pairToken}" aria-current="${sel===f.pairToken}">
      <span class="dot" style="background:${riskColor(f.risk)}"></span>
      <span class="sym">${esc(f.sym)}</span><span class="n">${f.n}</span></button>`).join('');

  if (ones.length) html += `<div class="pair rollup" style="cursor:default">
      <span class="dot"></span><span class="sym">${ones.length} with one launch</span><span class="n"></span></div>`
    + ones.map(f => `<button class="pair" data-pt="${f.pairToken}" aria-current="${sel===f.pairToken}">
      <span class="dot" style="background:${riskColor(f.risk)}"></span>
      <span class="sym">${esc(f.sym)}</span><span class="n">${f.n}</span></button>`).join('');

  document.getElementById('rail').innerHTML = html;
  drawStatus();
}

/* ---------- table ---------- */
const CLOCK = '<svg class="ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6V8l2.4 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

const COLS = [
  {key:'rank',     label:'',       sortable:false, cls:'hide-s'},
  {key:'tok',      label:'token',  sortable:false},
  {key:'value',    label:'value',  sortable:false, cls:'only-s'},
  {key:'mcapEth',  label:'mcap', cls:'hide-s', title:'last price on this market x circulating supply, converted at the USDG-implied ETH rate'},
  {key:'volEth',   label:'vol Ξ', cls:'hide-s', title:'derived from totalVolumeQuote at the last price, within a few percent'},
  {key:'trades',   label:'trades'},
  {key:'when',     label:CLOCK,    sortable:false, cls:'only-s'},
  {key:'lastTradeAt', label:'last', cls:'hide-s'},
  {key:'createdAt',   label:'age',  cls:'hide-s'}
];

function valueStack(m){
  const mc  = `<b>${usd(m.mcapEth)}${m.mcapEth ? '<small>MC</small>' : ''}</b>`;
  const vol = `<span>${eth(sel === null ? m.volEthToken : m.volEth)} vol</span>`;
  return sort.key === 'volEth'
    ? `<b>${eth(sel === null ? m.volEthToken : m.volEth)}<small>VOL</small></b><span class="q">${usd(m.mcapEth)} mc</span>`
    : mc + vol.replace('<span>', '<span class="q">');
}

function whenStack(m){
  const last = ago(m.lastTradeAt), age = ago(m.createdAt);
  return sort.key === 'createdAt'
    ? `<b>${age}</b><span class="q">${last}</span>`
    : `<b>${last}</b><span class="q">${age}</span>`;
}

function rows(){
  let r = markets.filter(m => risks.has(m.quoteRisk));
  if (sel !== null){
    r = r.filter(m => m.pairToken === sel);
  } else {
    // no pair chosen: collapse grouped launches so one token cannot eat five slots
    const seen = new Set(); const keep = [];
    for (const m of r.slice().sort((a,b) => b.volEth - a.volEth)){ // busiest pair is the token's face
      if (seen.has(m.token)) continue;
      seen.add(m.token); keep.push(m);
    }
    r = keep;
  }
  let k = sort.key; const d = sort.dir;
  if (sel === null && k === 'volEth') k = 'volEthToken';
  if (sel === null && k === 'trades') k = 'tradesToken';
  return r.sort((a,b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * d);
}

const SKW = [78,64,88,56,72,60,84,68,54,76,62,80,58,70,66,74];
const phone = () => window.matchMedia('(max-width:820px)').matches;

function skeleton(){
  const rail = document.getElementById('rail');
  if (rail) rail.innerHTML = Array.from({length:16}, (_, i) =>
    `<div class="pair sk"><span class="dot"></span><span class="sym"><span class="sk-b" style="width:${SKW[i]}px"></span></span><span class="n"></span></div>`).join('');

  const head = COLS.map(c => `<th class="${c.cls || ''}">${c.label}</th>`).join('');
  const body = Array.from({length:18}, (_, i) => {
    const w = SKW[i % SKW.length];
    return `<tr class="sk">
      <td class="hide-s"><span class="sk-b" style="width:10px"></span></td>
      <td class="tok"><div class="tokline"><span class="sk-b sq"></span><span class="tokname"><span class="sk-b" style="width:${w}px"></span><span class="sk-b sm" style="width:${44 + (i % 3) * 9}px"></span></span></div></td>
      <td class="only-s stack"><span class="sk-b" style="width:${58 + (i % 4) * 7}px"></span><span class="sk-b sm" style="width:${40 + (i % 3) * 8}px"></span></td>
      <td class="hide-s"><span class="sk-b" style="width:${52 + (i % 4) * 9}px"></span></td>
      <td class="hide-s"><span class="sk-b" style="width:${34 + (i % 3) * 10}px"></span></td>
      <td><span class="sk-b" style="width:${30 + (i % 4) * 8}px"></span></td>
      <td class="only-s stack"><span class="sk-b" style="width:26px"></span><span class="sk-b sm" style="width:20px"></span></td>
      <td class="hide-s"><span class="sk-b" style="width:24px"></span></td>
      <td class="hide-s"><span class="sk-b" style="width:22px"></span></td>
    </tr>`;
  }).join('');

  const sc = document.getElementById('scroll');
  if (sc) sc.innerHTML = phone()
    ? `<div class="slabs">` + Array.from({length:12}, (_, i) => `<article class="slab sk">
        <div class="slab-top">
          <span class="sk-b sq" style="width:34px;height:34px"></span>
          <div class="slab-id"><span class="sk-b" style="width:${SKW[i]}px"></span><span class="sk-b sm" style="width:${44 + (i % 3) * 9}px;margin-top:6px"></span></div>
          <div class="slab-val"><span class="sk-b" style="width:${58 + (i % 4) * 7}px"></span><span class="sk-b sm" style="width:${40 + (i % 3) * 8}px;margin-top:6px"></span></div>
        </div>
        <div class="slab-foot"><span class="sk-b" style="width:52px"></span><span class="sk-b" style="width:44px"></span><span class="sk-b" style="width:40px"></span></div>
      </article>`).join('') + `</div>`
    : `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  drawSorts();
}

function drawSorts(){
  const el = document.getElementById('sorts');
  if (!el) return;
  el.innerHTML = COLS.filter(c => c.sortable !== false).map(c => {
    const on = sort.key === c.key;
    const arrow = on ? (sort.dir < 0 ? ' \u2193' : ' \u2191') : '';
    return `<button class="chip" data-sort="${c.key}" aria-pressed="${on}">${c.label}${arrow}</button>`;
  }).join('');
}

function slabs(list){
  const activeFoot = k => sort.key === k ? ' class="on"' : '';
  return `<div class="slabs">` + list.map(m => {
    const vol = eth(sel === null ? m.volEthToken : m.volEth);
    const tx  = (n => n ? n.toLocaleString() : DASH)(sel === null ? m.tradesToken : m.trades);
    const volFirst = sort.key === 'volEth';
    return `<article class="slab" data-token="${m.token}">
      <div class="slab-top">
        ${m.cid ? `<img class="logo" src="${GATEWAYS[0]}${esc(m.cid)}" data-cid="${esc(m.cid)}" data-g="0" alt="" loading="lazy" onerror="nextGateway(this)">` : `<span class="logo"></span>`}
        <div class="slab-id">
          <span class="s"><a href="${TOKEN_PAGE(m.token)}" target="_blank" rel="noopener">${esc(m.symbol)}</a>${m.marketCount > 1 ? `<span class="mk">${m.marketCount}×</span>` : ''}</span>
          ${sel === null
            ? `<span class="qpill"><i style="background:${riskColor(m.quoteRisk)}"></i>${esc(m.quoteSymbol)}</span>`
            : `<span class="qpill"><i style="background:${riskColor(m.quoteRisk)}"></i>${esc(m.name)}</span>`}
        </div>
        <div class="slab-val">
          ${volFirst
            ? `<b>${vol}<small>VOL</small></b><span class="q">${usd(m.mcapEth)} mc</span>`
            : `<b>${usd(m.mcapEth)}${m.mcapEth ? '<small>MC</small>' : ''}</b><span class="q">${vol} vol</span>`}
        </div>
      </div>
      <div class="slab-foot">
        <span${activeFoot('trades')}>${tx}<em>tx</em></span>
        <span${activeFoot('lastTradeAt')}>${ago(m.lastTradeAt)}<em>last</em></span>
        <span${activeFoot('createdAt')}>${ago(m.createdAt)}<em>old</em></span>
      </div>
    </article>`;
  }).join('') + `</div>`;
}

function draw(){
  const sc = document.getElementById('scroll');
  const keepTop = sc ? sc.scrollTop : 0;
  drawRail();
  drawSorts();
  const f = sel === null ? null : facets.find(x => x.pairToken === sel);
  document.getElementById('ctx').innerHTML = f
    ? `<b>quoted in <span class="quote">${esc(f.sym)}</span></b><small>${f.n} market${f.n>1?'s':''} · ${esc(f.risk)}</small>`
    : `<b>All pairs</b>`;

  const list = rows();
  if (!list.length){
    document.getElementById('scroll').innerHTML =
      `<div class="state"><b>Nothing here yet</b>No market matches that quote and risk. Widen the risk filters, or pick another quote from the rail.</div>`;
    return;
  }

  const head = COLS.map(c => {
    const on = sort.key === c.key ? ' on' : '';
    const arrow = sort.key === c.key ? (sort.dir < 0 ? ' ↓' : ' ↑') : '';
    return `<th class="${c.cls||''}${on}">${c.sortable === false
      ? c.label
      : `<button data-sort="${c.key}"${c.title?` title="${c.title}"`:''}>${c.label}${arrow}</button>`}</th>`;
  }).join('');

  const body = list.map((m,i) => `<tr data-token="${m.token}" title="open ${esc(m.symbol)} on par.family">
    <td class="hide-s">${i+1}</td>
    <td class="tok">
      <div class="tokline">
        ${m.cid ? `<img class="logo" src="${GATEWAYS[0]}${esc(m.cid)}" data-cid="${esc(m.cid)}" data-g="0" alt="" loading="lazy" onerror="nextGateway(this)">` : `<span class="logo"></span>`}
        <span class="tokname">
          <span class="s"><a href="${TOKEN_PAGE(m.token)}" target="_blank" rel="noopener">${esc(m.symbol)}</a>${m.marketCount > 1 ? `<span class="mk">${m.marketCount}×</span>` : ''}</span>
          <span class="n">${sel === null
            ? `<span class="qpill"><i style="background:${riskColor(m.quoteRisk)}"></i>${esc(m.quoteSymbol)}</span>${m.marketCount > 1 ? ` <span class="via">+${m.marketCount-1}</span>` : ''}`
            : esc(m.name)}</span>
        </span>
      </div>
    </td>
    <td class="only-s stack val">${valueStack(m)}</td>
    <td class="mcap hide-s ${m.stale ? 'stale' : ''}" title="${m.mcapEth.toPrecision(3)} ETH${m.stale ? ' (quote price stale, approximate)' : ''}">${usd(m.mcapEth)}${m.mcapEth ? '<small>MC</small>' : ''}</td>
    <td class="hide-s">${eth(sel === null ? m.volEthToken : m.volEth)}</td>
    <td>${(n => n ? n.toLocaleString() : DASH)(sel === null ? m.tradesToken : m.trades)}</td>
    <td class="only-s stack">${whenStack(m)}</td>
    <td class="hide-s">${ago(m.lastTradeAt)}</td>
    <td class="hide-s">${ago(m.createdAt)}</td>
  </tr>`).join('');

  sc.innerHTML = phone() ? slabs(list) : `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  sc.scrollTop = keepTop;
}

/* ---------- events ---------- */
document.getElementById('rail').addEventListener('click', e => {
  const b = e.target.closest('.pair[data-pt]');
  if (!b) return;
  sel = b.dataset.pt || null;
  draw();
  document.getElementById('scroll').scrollTop = 0;
});
document.getElementById('q').addEventListener('input', drawRail);
document.getElementById('sorts').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]');
  if (!b) return;
  const k = b.dataset.sort;
  sort = {key:k, dir: sort.key === k ? -sort.dir : -1};
  draw();
});
document.getElementById('risks').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const r = b.dataset.risk;
  risks.has(r) ? risks.delete(r) : risks.add(r);
  b.setAttribute('aria-pressed', risks.has(r));
  draw();
});
document.getElementById('scroll').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]');
  if (b){
    const k = b.dataset.sort;
    sort = {key:k, dir: sort.key === k ? -sort.dir : -1};
    draw();
    return;
  }
  if (e.target.closest('a')) return;              // the symbol link handles itself
  const row = e.target.closest('tr[data-token]');
  if (row) window.open(TOKEN_PAGE(row.dataset.token), '_blank', 'noopener');
});

/* ---------- go ---------- */
skeleton();
window.matchMedia('(max-width:820px)').addEventListener('change', () => {
  if (markets.length) draw(); else skeleton();
});

(async () => {
  const p0 = page(0), p1 = page(500).catch(() => []);
  const first = await p0;
  usdPerEth = deriveUsd(first);
  store(first);
  rebuild();
  connect();

  const rest = await p1;
  if (rest.length){
    store(rest);
    const rate = deriveUsd([...rawByToken.values()]);
    if (rate) usdPerEth = rate;
    rebuild();
  }
  if (rest.length === 500){
    for (let off = 1000; off < 6000; off += 500){
      const more = await page(off).catch(() => []);
      if (!more.length) break;
      store(more);
      rebuild();
      if (more.length < 500) break;
    }
  }
  setInterval(() => { if (!dirty.size) draw(); }, 45000);
})().catch(err => {
  document.getElementById('scroll').innerHTML =
    `<div class="state"><b>${esc(err.message)}</b></div>`;
  document.getElementById('railnote').textContent = 'offline';
});
</script>
</body>
</html>
